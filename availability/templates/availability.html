{% extends "base.html" %}

{% block content %}
<h1>{{ employee.first_name }} {{ employee.last_name }} - Availability</h1>

<section class="calendar-wrapper" aria-label="Availability calendar">
    <div id="calendar"></div>
</section>

<dialog id="eventModal" class="availability-dialog">
    <h2>Edit availability</h2>
    <form method="dialog">
        <div class="availability-event-details">
            <p><strong>Shift:</strong> <span id="eventTitle"></span></p>
            <p><strong>Time:</strong> <span id="eventTime"></span></p>
        </div>
        <fieldset class="availability-field">
            <legend>Availability</legend>
            <div class="availability-choice-group">
                <button id="availableButton" class="availability-choice" type="button" aria-pressed="false">
                    Available
                </button>
                <button id="busyButton" class="availability-choice" type="button" aria-pressed="false">
                    Busy
                </button>
            </div>
        </fieldset>
        <div class="availability-modal-actions">
            <button id="closeModalBtn" type="submit">Close</button>
        </div>
    </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script>
    const calendarElement = document.getElementById('calendar');
    const modal = document.getElementById('eventModal');
    const eventTitle = document.getElementById('eventTitle');
    const eventTime = document.getElementById('eventTime');
    const availableButton = document.getElementById('availableButton');
    const busyButton = document.getElementById('busyButton');
    const modalActionButton = document.getElementById('closeModalBtn');
    let selectedEvent = null;
    let originalAvailability = null;
    let selectedAvailability = 2;

    const approvedDays = new Set({{ approved_days|tojson }});
    const backgroundEvents = {{ background|tojson }}.flatMap(event => {
        const nextDay = new Date(`${event.start}T00:00:00Z`);
        nextDay.setUTCDate(nextDay.getUTCDate() + 1);
        const firstDayEnd = nextDay.toISOString().slice(0, 10);
        const firstDay = { ...event, end: firstDayEnd };
        return firstDayEnd >= event.end
            ? [firstDay]
            : [firstDay, { ...event, start: firstDayEnd, title: '' }];
    });

    function isApprovedDay(date) {
        const localDate = [
            date.getFullYear(),
            String(date.getMonth() + 1).padStart(2, '0'),
            String(date.getDate()).padStart(2, '0')
        ].join('-');
        return approvedDays.has(localDate);
    }

    function setAvailability(availability) {
        selectedAvailability = availability;
        const available = availability === 1;
        const busy = availability === 0;
        availableButton.setAttribute('aria-pressed', available);
        busyButton.setAttribute('aria-pressed', busy);
        availableButton.classList.toggle('is-selected', available);
        busyButton.classList.toggle('is-selected', busy);
        modalActionButton.textContent = availability === originalAvailability ? 'Close' : 'Save';
    }

    [availableButton, busyButton].forEach(button => {
        button.addEventListener('click', () => {
            setAvailability(button === availableButton ? 1 : 0);
        });
    });

    modal.addEventListener('close', async () => {
        const event = selectedEvent;
        selectedEvent = null;
        if (!event || selectedAvailability === originalAvailability) return;

        const previous = {
            color: event.backgroundColor,
            availability: event.extendedProps.availability
        };
        event.setProp('color', selectedAvailability === 1 ? 'green' : 'red');
        event.setExtendedProp('availability', selectedAvailability);

        try {
            const response = await fetch('{{ url_for("availability.availability") }}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id: event.id,
                    shift_name: event.title,
                    start: event.start.toISOString(),
                    end: event.end.toISOString(),
                    start_timezone_offset: event.start.getTimezoneOffset(),
                    end_timezone_offset: event.end.getTimezoneOffset(),
                    availability: selectedAvailability
                })
            });
            const result = await response.json();
            if (!response.ok || result.status !== 'success') {
                throw new Error(result.message || 'Failed to update availability.');
            }
            event.setProp('id', String(result.id));
        } catch (error) {
            console.error('Unable to save availability:', error);
            event.setProp('color', previous.color);
            event.setExtendedProp('availability', previous.availability);
            alert('Failed to save event changes. The event has been reverted.');
        }
    });

    const calendar = new FullCalendar.Calendar(calendarElement, {
        initialView: 'timeGridWeek',
        height: 'auto',
        slotDuration: '00:30:00',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek'
        },
        eventSources: [
            { events: {{ availability|tojson }} },
            { events: backgroundEvents }
        ],
        eventClassNames: ({ event, isStart }) => {
            if (event.display === 'background') {
                return isStart ? [] : ['bg-continuation'];
            }
            return event.start && isApprovedDay(event.start) ? ['time-off-locked'] : [];
        },
        eventClick: info => {
            info.jsEvent.preventDefault();
            if (info.event.start && isApprovedDay(info.event.start)) return;

            selectedEvent = info.event;
            eventTitle.textContent = info.event.title;
            const options = { hour: 'numeric', minute: '2-digit' };
            const start = info.event.start.toLocaleTimeString([], options);
            const end = info.event.end?.toLocaleTimeString([], options);
            eventTime.textContent = end ? `${start} - ${end}` : start;
            originalAvailability = Number(info.event.extendedProps.availability);
            setAvailability(originalAvailability);
            modal.showModal();
        }
    });
    calendar.render();
</script>
{% endblock %}
