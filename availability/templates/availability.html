<!DOCTYPE html>
<html>
<head>
    <title>WorkforceIQ</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <span class="navbar-text">Schedule</span>
        <a href="{{ url_for('availability.availability') if current_user.system_role_id == 1 else url_for('availability.avail_select') }}">Availability</a>
        <a href="{{ url_for('employee.employees') }}">Employees</a>
        <span class="navbar-text" {% if current_user.system_role_id != 3 %}hidden=true{% endif %}>Users</span>
        <a href="{{ url_for('forecast.forecast') }}" {% if current_user.system_role_id == 1 %}hidden=true{% endif %}>Forecast</a>
        <span class="navbar-text" {% if current_user.system_role_id == 1 %}hidden=true{% endif %}>Reports</span>
        <a href="{{ url_for('assistant.ai_assistant') }}">AI Assistant</a>
        {% if current_user.is_authenticated %}
        <span class="navbar-username">{{ current_user.username }}</span>
        <a href="{{ url_for('auth.logout') }}" class="navbar-logout">Logout</a>
        {% endif %}
    </nav>
    <main class="container">
        <h1>Availability</h1>
    <button id="addEventBtn" class="add-event-button" type="button">Add Event</button>
    <div class="calendar-wrapper dashboard">
        <div id="calendar" class="availability_calendar"></div>
    </div>
    <dialog id="eventModal" style="padding: 20px; border-radius: 8px; border: 1px solid #ccc; width: 300px;">
        <h3 id="modalHeading" style="margin-top: 0;">Edit availability</h3>
        <form method="dialog">
            <div class="availability-field">
                <label for="modalTitle">Title:</label>
                <input id="modalTitle" type="text" required>
            </div>
            <div class="availability-field">
                <label for="modalStart">Start:</label>
                <input id="modalStart" type="datetime-local" step="900" required>
            </div>
            <div class="availability-field">
                <label for="modalEnd">End:</label>
                <input id="modalEnd" type="datetime-local" step="900" required>
            </div>
            <div class="availability-field" id="recurrenceField">
                <label for="modalRecurrence">Repeat:</label>
                <select id="modalRecurrence">
                    <option value="none">Does not repeat</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                </select>
            </div>
            <div class="availability-field" id="recurrenceUntilField" hidden>
                <label for="modalRecurrenceUntil">Repeat until:</label>
                <input id="modalRecurrenceUntil" type="date">
            </div>
            <div class="availability-field availability-checkbox">
                <label for="modalAvailable">Available?</label>
                <input id="modalAvailable" type="checkbox">
            </div>
            <div class="availability-modal-actions">
                <button id="cancelCreateEventBtn" type="button" hidden>Cancel</button>
                <button id="closeModalBtn" type="submit">Close</button>
                <button id="deleteEventBtn" onclick="removeEvent(selectedEvent)" type="button">
                    Delete
                </button>
            </div>
        </form>
    </dialog>
    <script>
        let calendarEl = document.getElementById('calendar');
        let modal = document.getElementById('eventModal');
        let titleInput = document.getElementById('modalTitle');
        let startInput = document.getElementById('modalStart');
        let endInput = document.getElementById('modalEnd');
        let recurrenceInput = document.getElementById('modalRecurrence');
        let recurrenceUntilInput = document.getElementById('modalRecurrenceUntil');
        let recurrenceField = document.getElementById('recurrenceField');
        let recurrenceUntilField = document.getElementById('recurrenceUntilField');
        let availableInput = document.getElementById('modalAvailable');
        let cancelCreateEventButton = document.getElementById('cancelCreateEventBtn');
        let closeModalButton = document.getElementById('closeModalBtn');
        let addEventButton = document.getElementById('addEventBtn');
        let deleteEventButton = document.getElementById('deleteEventBtn');
        let modalHeading = document.getElementById('modalHeading');
        let selectedEvent = null;
        let originalValues = null;
        let creatingEvent = false;

        function removeEvent(event) {
            if (!event) {
                return;
            }
            if (confirm('Are you sure you want to delete this event?')) {
                // Call delete API endpoint to remove the event from the database
                fetch('/availability', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ id: event.id })
                })
                .then(response => response.json())
                .then(data => {
                    // If successful, remove the event from the calendar and close the modal
                    if (data.status === 'success') {
                        event.remove();
                        modal.close();
                    } else {
                        alert('Failed to delete event.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Failed to delete event due to a network error.');
                });
            }
        }

        // Function to get the current values from the modal inputs, used to
        // determine if any changes have been made to the event details
        function getModalValues() {
            return {
                title: titleInput.value,
                start: startInput.value,
                end: endInput.value,
                recurrence: recurrenceInput.value,
                recurrenceUntil: recurrenceUntilInput.value,
                available: availableInput.checked
            };
        }

        function updateRecurrenceFields() {
            const repeats = recurrenceInput.value !== 'none';
            recurrenceUntilField.hidden = !repeats;
            recurrenceUntilInput.required = repeats;
            recurrenceUntilInput.min = startInput.value.slice(0, 10);
        }

        // Changes from Save to Close based on if changes have been made
        function updateModalButton() {
            const values = getModalValues();
            const hasEdits = creatingEvent || (originalValues &&
                Object.keys(values).some(key => values[key] !== originalValues[key]));
            closeModalButton.textContent = hasEdits ? 'Save' : 'Close';
        }

        // Add event listeners to update the modal button text when any input changes
        // Calls above method
        [titleInput, startInput, endInput, recurrenceInput, recurrenceUntilInput, availableInput].forEach(input => {
            input.addEventListener('input', updateModalButton);
            input.addEventListener('change', updateModalButton);
        });
        recurrenceInput.addEventListener('change', updateRecurrenceFields);
        startInput.addEventListener('change', updateRecurrenceFields);

        // Passed date is formatted to datetime-local format
        function toDateTimeLocal(date) {
            const pad = value => String(value).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}` +
                `T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
        }

        // Round current time to closest 15 minute interval after now
        function getRoundedCurrentTime() {
            const interval = 15 * 60 * 1000;
            return new Date(Math.ceil(Date.now() / interval) * interval);
        }

        // Calls 2 functions above, gets rounded time then formats it
        function getCurrentTime() {
            return toDateTimeLocal(getRoundedCurrentTime()).slice(0, 16);
        }

        // Called when making new event
        function openCreateEventModal(start) {
            // End is 1 hour after start time
            const end = new Date(start.getTime() + 60 * 60 * 1000);
            
            // Making an event, not selecting, so empty values
            creatingEvent = true;
            selectedEvent = null;
            originalValues = null;
            modalHeading.textContent = 'Add availability';
            titleInput.value = '';
            recurrenceInput.value = 'none';
            recurrenceUntilInput.value = '';

            //Get rounded time for min value allowed
            startInput.min = getCurrentTime();
            endInput.min = getCurrentTime();

            //Gets formatted version of the start and end time
            startInput.value = toDateTimeLocal(start);
            endInput.value = toDateTimeLocal(end);
            recurrenceField.hidden = false;
            updateRecurrenceFields();

            //Set available to true, no delete option
            availableInput.checked = true;
            deleteEventButton.hidden = true;
            cancelCreateEventButton.hidden = false;

            //Get correct modal button "Save", then show
            updateModalButton();
            modal.showModal();
        }

        cancelCreateEventButton.addEventListener('click', function() {
            creatingEvent = false;
            modal.close();
        });

        // On click of "add event," call above function
        addEventButton.addEventListener('click', function() {
            openCreateEventModal(getRoundedCurrentTime());
        });

        //On click of cancel, cancel creating event
        modal.addEventListener('cancel', function() {
            if (creatingEvent) {
                creatingEvent = false;
            }
        });

        //When closing modal
        modal.addEventListener('close', function() {
            //If creating
            if (creatingEvent) {
                creatingEvent = false;
                //Get start and end
                const start = new Date(startInput.value);
                const end = new Date(endInput.value);

                //Ensure all inputs are legitimate
                if (!titleInput.value.trim() || !startInput.value || !endInput.value ||
                        Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) || end <= start ||
                        (recurrenceInput.value !== 'none' &&
                            (!recurrenceUntilInput.value ||
                                recurrenceUntilInput.value < startInput.value.slice(0, 10)))) {
                    alert('Enter a title and a valid start and end time.');
                    creatingEvent = true;
                    modal.showModal();
                    return;
                }

                //Save event data and POST to the API endpoint
                const eventData = {
                    title: titleInput.value.trim(),
                    start: toDateTimeLocal(start),
                    end: toDateTimeLocal(end),
                    availability: availableInput.checked ? 1 : 0,
                    recurrence: recurrenceInput.value,
                    recurrence_until: recurrenceUntilInput.value
                };
                fetch('/availability', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(eventData)
                })
                .then(response => response.json().then(data => ({ response, data })))
                .then(({ response, data }) => {
                    //If bad response, throw errer
                    if (!response.ok || data.status !== 'success') {
                        throw new Error(data.message || 'Failed to create event.');
                    }
                    data.events.forEach(function(event) {
                        calendar.addEvent({
                            id: event.id,
                            title: eventData.title,
                            start: event.start,
                            end: event.end,
                            color: eventData.availability ? 'green' : 'red',
                            extendedProps: { availability: eventData.availability }
                        });
                    });
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Failed to add event. Please try again.');
                    creatingEvent = true;
                    modal.showModal();
                });
                return;
            }
            if (!selectedEvent) {
                return;
            }

            const event = selectedEvent;
            selectedEvent = null;
            if (!originalValues ||
                    !Object.keys(originalValues).some(key => getModalValues()[key] !== originalValues[key])) {
                originalValues = null;
                return;
            }
            originalValues = null;
            const start = new Date(startInput.value);
            const end = new Date(endInput.value);
            if (!titleInput.value.trim() || !startInput.value || !endInput.value ||
                    Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) || end <= start) {
                alert('Enter a title and a valid start and end time.');
                return;
            }

            const previous = {
                title: event.title,
                start: event.start,
                end: event.end,
                color: event.backgroundColor,
                availability: event.extendedProps.availability
            };
            const isAvailable = availableInput.checked;
            const startValue = toDateTimeLocal(start);
            const endValue = toDateTimeLocal(end);

            event.setProp('title', titleInput.value.trim());
            event.setDates(start, end);
            event.setProp('color', isAvailable ? 'green' : 'red');
            event.setExtendedProp('availability', isAvailable ? 1 : 0);

            fetch('/availability', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    id: event.id,
                    title: event.title,
                    start: startValue,
                    end: endValue,
                    availability: isAvailable ? 1 : 0
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status !== 'success') {
                    throw new Error('Failed to update event.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                event.setProp('title', previous.title);
                event.setDates(previous.start, previous.end);
                event.setProp('color', previous.color);
                event.setExtendedProp('availability', previous.availability);
                alert('Failed to save event changes. The event has been reverted.');
            });
        });

        let calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'timeGridWeek',
            selectable: true,
            editable: true,
            height: 'auto',
            contentHeight: 'auto',
            slotDuration: '00:15:00',
            slotMinTime: '00:00:00',
            slotMaxTime: '24:00:00',
            allDaySlot: true,
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek'
            },
            events: [
                {% for event in availability %}
                {
                    id: '{{ event.id }}',
                    title: '{{ event.title }}',
                    start: '{{ event.start }}',
                    end: '{{ event.end }}',
                    color: '{{ event.color }}'
                },
                {% endfor %}
            ],
            dateClick: function(info) {
                openCreateEventModal(info.date);
            },
            eventClick: function(info) {
                info.jsEvent.preventDefault();
                creatingEvent = false;
                selectedEvent = info.event;
                modalHeading.textContent = 'Edit availability';
                titleInput.value = info.event.title;
                recurrenceInput.value = 'none';
                recurrenceUntilInput.value = '';
                recurrenceField.hidden = true;
                cancelCreateEventButton.hidden = true;
                updateRecurrenceFields();
                startInput.value = info.event.start ? toDateTimeLocal(info.event.start) : '';
                endInput.value = info.event.end ? toDateTimeLocal(info.event.end) : '';
                availableInput.checked = info.event.backgroundColor !== 'red';
                deleteEventButton.hidden = false;
                originalValues = getModalValues();
                updateModalButton();
                modal.showModal();
            },
            eventResize: function(info) {
                var eventData = {
                    id: info.event.id,
                    start: info.event.startStr,
                    end: info.event.endStr,
                };

                fetch('/availability', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(eventData)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status !== 'success') {
                        alert('Failed to update event layout. Reverting...');
                        info.revert(); // Puts the event back to its original position if server failed
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    info.revert(); // Puts the event back on network error
                });
            },
            eventDrop: function(info) {
                var eventData = {
                    id: info.event.id,
                    start: info.event.startStr,
                    end: info.event.endStr,
                };

                fetch('/availability', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(eventData)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status !== 'success') {
                        alert('Failed to update event layout. Reverting...');
                    info.revert(); // Puts the event back to its original position if server failed
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    info.revert(); // Puts the event back on network error
                });
            },
        });
        calendar.render();

        window.addEventListener('resize', function () {
            calendar.updateSize();
        });
    </script>
    </main>
    <footer class="footer">
         WorkforceIQ Proof of Concept
    </footer>
</body>
