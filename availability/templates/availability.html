<!DOCTYPE html>
<html>
<head>
    <title>WorkforceIQ</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <span class="navbar-text">Schedule</span>
        <a href="{{ url_for('availability.availability') if current_user.system_role_id == 1 else url_for('availability.avail_select') }}">Availability</a>
        <a href="{{ url_for('employee.employees') }}">Employees</a>
        <span class="navbar-text" {% if current_user.system_role_id != 3 %}hidden=true{% endif %}>Users</span>
        <a href="{{ url_for('forecast.forecast') }}" {% if current_user.system_role_id == 1 %}hidden=true{% endif %}>Forecast</a>
        <span class="navbar-text" {% if current_user.system_role_id == 1 %}hidden=true{% endif %}>Reports</span>
        <a href="{{ url_for('assistant.ai_assistant') }}">AI Assistant</a>
        {% if current_user.is_authenticated %}
        <span class="navbar-username">{{ current_user.username }}</span>
        <a href="{{ url_for('auth.logout') }}" class="navbar-logout">Logout</a>
        {% endif %}
    </nav>
    <main class="container">
        <h1>Availability</h1>
    <div class="calendar-wrapper dashboard">
        <div id="calendar" class="availability_calendar"></div>
    </div>
    <dialog id="eventModal" style="padding: 20px; border-radius: 8px; border: 1px solid #ccc; width: 300px;">
        <h3 id="modalHeading" style="margin-top: 0;">Edit availability</h3>
        <form method="dialog">
            <div class="availability-event-details">
                <p><strong>Title:</strong> <span id="eventTitle"></span></p>
                <p><strong>Time:</strong> <span id="eventTime"></span></p>
            </div>
            <div class="availability-field">
                <label>Availability:</label>
                <div class="availability-choice-group" role="group" aria-label="Availability">
                    <button id="availableButton" class="availability-choice" type="button" aria-pressed="false">
                        Available
                    </button>
                    <button id="busyButton" class="availability-choice" type="button" aria-pressed="false">
                        Busy
                    </button>
                </div>
            </div>
            <div class="availability-modal-actions">
                <button id="closeModalBtn" type="submit">Close</button>
            </div>
        </form>
    </dialog>
    <script>
        let calendarEl = document.getElementById('calendar');
        let modal = document.getElementById('eventModal');
        let eventTitle = document.getElementById('eventTitle');
        let eventTime = document.getElementById('eventTime');
        let availableButton = document.getElementById('availableButton');
        let busyButton = document.getElementById('busyButton');
        let closeModalButton = document.getElementById('closeModalBtn');
        let selectedEvent = null;
        let originalAvailability = null;
        let selectedAvailability = 0;

        function setAvailability(availability) {
            selectedAvailability = availability;
            availableButton.setAttribute('aria-pressed', availability === 0);
            busyButton.setAttribute('aria-pressed', availability === 2);
            availableButton.classList.toggle('is-selected', availability === 0);
            busyButton.classList.toggle('is-selected', availability === 2);
        }

        function updateModalButton() {
            closeModalButton.textContent = selectedAvailability !== originalAvailability ? 'Save' : 'Close';
        }

        [availableButton, busyButton].forEach(button => {
            button.addEventListener('click', function() {
                setAvailability(button === availableButton ? 0 : 2);
                updateModalButton();
            });
        });
        modal.addEventListener('close', function() {
            const event = selectedEvent;
            selectedEvent = null;
            if (!event || selectedAvailability === originalAvailability) {
                return;
            }

            const previous = {
                color: event.backgroundColor,
                availability: event.extendedProps.availability
            };
            const availability = selectedAvailability;

            if (availability !== 1) {
                event.setProp('color', availability === 0 ? 'green' : 'red');
            }
            event.setExtendedProp('availability', availability);

            fetch('/availability', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    id: event.id,
                    shift_name: event.title,
                    start: event.start.toISOString(),
                    end: event.end.toISOString(),
                    start_timezone_offset: event.start.getTimezoneOffset(),
                    end_timezone_offset: event.end.getTimezoneOffset(),
                    availability: selectedAvailability
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status !== 'success') {
                    throw new Error('Failed to update event.');
                }
                event.setProp('id', String(data.id));
            })
            .catch(error => {
                console.error('Error:', error);
                event.setProp('color', previous.color);
                event.setExtendedProp('availability', previous.availability);
                alert('Failed to save event changes. The event has been reverted.');
            });
        });

        let calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'timeGridWeek',
            selectable: true,
            editable: false,
            height: 'auto',
            contentHeight: 'auto',
            slotDuration: '00:15:00',
            slotMinTime: '00:00:00',
            slotMaxTime: '24:00:00',
            allDaySlot: true,
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek'
            },
            events: [
                {% for event in availability %}
                {
                    id: {{ event.id|tojson }},
                    title: '{{ event.title }}',
                    startTime: '{{ event.startTime }}',
                    endTime: '{{ event.endTime }}',
                    daysOfWeek: {{ event.daysOfWeek|tojson }},
                    availability: {{ event.availability }},
                    color: '{{ event.color }}'
                },
                {% endfor %}
            ],
            eventClick: function(info) {
                info.jsEvent.preventDefault();
                selectedEvent = info.event;
                eventTitle.textContent = info.event.title;
                const timeOptions = { hour: 'numeric', minute: '2-digit' };
                const startTime = info.event.start.toLocaleTimeString([], timeOptions);
                const endTime = info.event.end
                    ? info.event.end.toLocaleTimeString([], timeOptions)
                    : '';
                eventTime.textContent = endTime ? `${startTime} - ${endTime}` : startTime;
                setAvailability(Number(info.event.extendedProps.availability));
                originalAvailability = selectedAvailability;
                updateModalButton();
                modal.showModal();
            },
        });
        calendar.render();

        window.addEventListener('resize', function () {
            calendar.updateSize();
        });
    </script>
    </main>
    <footer class="footer">
         WorkforceIQ Proof of Concept
    </footer>
</body>
