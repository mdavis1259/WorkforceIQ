<!DOCTYPE html>
<html>
<head>
    <title>Employees</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static',
        filename='style.css') }}"
    >
</head>
<body>

<div class="dashboard">

    <h1>Employee Management</h1>

    <form
        action="/add_employee"
        method="POST"
        class="employee-form"
    >

        <input
            type="text"
            name="name"
            placeholder="Employee Name"
            required
        >

        <input
            type="text"
            name="role"
            placeholder="Role"
            required
        >

        <input
            type="number"
            step="0.01"
            name="wage"
            placeholder="Hourly Wage"
            required
        >

        <button class="btn">
            Add Employee
        </button>

    </form>

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Role</th>
            <th>Hourly Wage</th>
        </tr>

        {% for emp in employees %}

        <tr>
            <td>{{ emp[0] }}</td>
            <td>{{ emp[1] }}</td>
            <td>{{ emp[2] }}</td>
            <td>${{ "%.2f"|format(emp[3]) }}</td>
        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
