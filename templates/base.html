<!DOCTYPE html>
<html>
<head>
    <title>WorkforceIQ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

     <nav class="navbar">
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('scheduling.schedule_workbench') }}" {% if current_user.system_role_id == 1 %}hidden=true{% endif %}>Schedule</a>
        <a href="{{ url_for('availability.availability_detail', employee_id=current_user.employee_id) if current_user.system_role_id == 1 else url_for('availability.availability_selector') }}">Availability</a>
        <a href="{{ url_for('employee.employees') }}">Employees</a>
        <a href="{{ url_for('user.users') }}" {% if current_user.system_role_id != 3 %}hidden=true{% endif %}>Users</a>
        <a href="{{ url_for('forecast.forecast') }}" {% if current_user.system_role_id == 1 %}hidden=true{% endif %}>Forecast</a>
        <a href="{{ url_for('assistant.ai_assistant') }}">AI Assistant</a>
        {% if current_user.is_authenticated %}  
        <span class="navbar-username">{{ current_user.username }}</span>
        <a href="{{ url_for('auth.logout') }}" class="navbar-logout">Logout</a>
        {% endif %}
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>
    <footer class="footer">
         WorkforceIQ Proof of Concept
    </footer>
    
</body>
</html>
