{% extends "base.html" %}

{% block content %}

<style>

.fc-event {
    overflow: visible !important;
    border: none !important;
    background: transparent !important;
    cursor: pointer;
}

.shift-card {
    background: white;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.1);
    font-size: 12px;
}

.shift-header {
    background: #1f2937;
    color: white;
    padding: 8px;
}

.shift-title {
    font-weight: bold;
    font-size: 13px;
}

.shift-time {
    font-size: 11px;
}

.card-metric {
    padding: 6px 8px;
    font-size: 11px;
    font-weight: bold;
}

.card-budget {
    margin: 4px 8px;
    padding: 4px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: bold;
}

.card-budget.good {
    background: #dcfce7;
    color: #166534;
}

.card-budget.bad {
    background: #fee2e2;
    color: #991b1b;
}

.card-status {
    margin: 4px 8px 8px;
    font-size: 11px;
    text-transform: uppercase;
    font-weight: bold;
}

.role-section {
    padding: 6px;
    margin: 4px;
    border-radius: 4px;
}

.role-title {
    font-weight: bold;
    margin-bottom: 4px;
    text-transform: uppercase;
    font-size: 11px;
}

.employee {
    margin-left: 6px;
}

.role-admin {
    border-left: 5px solid #d97706;
    background: #fff7ed;
}

.role-manager {
    border-left: 5px solid #7c3aed;
    background: #f5f3ff;
}

.role-associate {
    border-left: 5px solid #2563eb;
    background: #eff6ff;
}

</style>

<h1>Schedule Workbench</h1>

<form
    method="post"
    action="{{ url_for('scheduling.generate_schedule') }}"
>
    <label>Week Start Date</label>

    <input
        type="date"
        name="week_start"
        required
    >

    <button type="submit">
        Open Schedule
    </button>
</form>

{% if schedule %}

<hr>

<div class="d-flex justify-content-between align-items-center">

    <div>

        <h2>Schedule Workbench</h2>

        <p>
            <strong>Week Start:</strong>
            {{ schedule["week_start"] }}
        </p>

        <p>
            <strong>Status:</strong>
            {{ schedule["status"] }}
        </p>

    </div>

    <div>

        <button
            class="btn btn-success"
            disabled
        >
            Approve Schedule
        </button>

    </div>

</div>

{% endif %}

<hr>

<div id="calendar"></div>

{% if calendar_events %}

<link
    href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"
    rel="stylesheet"
/>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>

async function openShiftModal(
    shiftId,
    scheduleDate
)
{
    const response =
        await fetch(
            `/shift/${shiftId}/${scheduleDate}`
        );

    const assignments =
        await response.json();

    const administrators =
        assignments.filter(
            a => a.role_name.includes("Administrator")
        );

    const managers =
        assignments.filter(
            a => a.role_name.includes("Manager")
        );

    const associates =
        assignments.filter(
            a => a.role_name.includes("Associate")
        );

    let html = `

        <div class="mb-4">

            <h5>Administrator (1 Required)</h5>

            <select class="form-select">

                <option>
                    Charlie Administrator
                </option>

            </select>

        </div>

        <div class="mb-4">

            <h5>Manager (1 Required)</h5>

            <select class="form-select">

                <option>
                    Bob Manager
                </option>

            </select>

        </div>

        <div class="mb-4">

            <h5>Associates (3 Required)</h5>

            <select class="form-select mb-2">

                <option>
                    April Associate
                </option>

            </select>

            <select class="form-select mb-2">

                <option>
                    Dave Associate
                </option>

            </select>

            <select class="form-select">

                <option>
                    Evan Associate
                </option>

            </select>

        </div>

        <hr>

        <div>

            <strong>Labor Cost:</strong>
            $112.00

            <br>

            <strong>Budget:</strong>
            $140.00

            <br>

            <span class="text-success">
                Within Budget
            </span>

        </div>

    `;

    if (assignments.length)
    {
        document.getElementById(
            "shiftModalTitle"
        ).innerHTML = `
            ${assignments[0].shift_name}
            <br>
            <small>
                ${assignments[0].schedule_date}
            </small>
       `;
    }

    document.getElementById(
        "shiftModalBody"
    ).innerHTML = html;

    const modal =
        new bootstrap.Modal(
            document.getElementById(
                "shiftModal"
            )
        );

    modal.show();
}

document.addEventListener(
    "DOMContentLoaded",
    function()
    {
        const calendarEl =
            document.getElementById("calendar");

        const calendar =
            new FullCalendar.Calendar(
                calendarEl,
                {
                    initialView: "timeGridWeek",

                    initialDate:
                        "{{ schedule['week_start'] if schedule else '' }}",

                    eventMinHeight: 150,

                    eventShortHeight: 150,

                    slotMinTime: "06:00:00",

                    slotMaxTime: "23:00:00",

                    allDaySlot: false,

                    expandRows: true,

                    eventClick: function(info)
                    {
                        console.log(info.event.extendedProps);

                        openShiftModal(
                            info.event.extendedProps.shift_id,
                            info.event.extendedProps.schedule_date
                        );
                    },

                    eventContent: function(info)
                    {
                        return {
                            html:
                                info.event.extendedProps.html
                        };
                    },

                    height: "auto",

                    headerToolbar:
                    {
                        left:
                            "prev,next today",

                        center:
                            "title",

                        right:
                            "timeGridWeek,timeGridDay"
                    },

                    events:
                        {{ calendar_events|tojson }}
                }
            );

        calendar.render();
    }
);

</script>

{% endif %}

<div
    class="modal fade"
    id="shiftModal"
    tabindex="-1"
    aria-hidden="true"
>

    <div class="modal-dialog modal-xl modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    id="shiftModalTitle"
                    class="modal-title"
                >
                    Shift Details
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>

            <div
                id="shiftModalBody"
                class="modal-body"
            >
            </div>
            
            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                >
                    Save Changes
                </button>

<           </div>

        </div>

    </div>

</div>

{% endblock %}
